{% extends "base.html" %}

{% block title %}Change Lab Assistant password{% endblock %}

{% block content %}

<div class="page-wrap narrow-page">

    <a
        class="back-link"
        href="{{ url_for('hod_dashboard') }}"
    >
        ← Back to HOD workspace
    </a>

    <section class="page-heading">

        <div>

            <div class="eyebrow">
                SECURITY
            </div>

            <h1>
                Change Lab Assistant password
            </h1>

            <p>
                Set a new password for the Lab Assistant account.
            </p>

        </div>

    </section>


    <section class="panel">

        <div
            style="
                padding:14px;
                margin-bottom:20px;
                border-radius:10px;
                background:var(--surface-2);
                border:1px solid var(--line);
            "
        >

            <strong>
                {{ admin['full_name'] }}
            </strong>

            <small
                style="
                    display:block;
                    color:var(--muted);
                    margin-top:4px;
                "
            >
                {{ admin['email'] }}
            </small>

        </div>


        <form
            method="post"
            class="form-stack"
        >

            <input
                type="hidden"
                name="csrf"
                value="{{ csrf_token }}"
            >

            <label>

                New Lab Assistant password

                <input
                    type="password"
                    name="new_password"
                    required
                    minlength="8"
                    autocomplete="new-password"
                >

            </label>


            <label>

                Confirm new password

                <input
                    type="password"
                    name="confirm_password"
                    required
                    minlength="8"
                    autocomplete="new-password"
                >

            </label>


            <button
                class="button"
                type="submit"
            >
                Change Lab Assistant password
                <span>→</span>
            </button>

        </form>

    </section>

</div>

{% endblock %}
