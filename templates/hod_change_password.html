{% extends "base.html" %}

{% block title %}Change HOD password{% endblock %}

{% block content %}

<div class="page-wrap narrow-page">

    <a
        class="back-link"
        href="{{ url_for('hod_dashboard') }}"
    >
        ← Back to HOD workspace
    </a>

    <section class="page-heading">

        <div>

            <div class="eyebrow">
                SECURITY
            </div>

            <h1>
                Change your HOD password
            </h1>

            <p>
                Update the password used to sign in to the HOD workspace.
            </p>

        </div>

    </section>

    <section class="panel">

        <form
            method="post"
            class="form-stack"
        >

            <input
                type="hidden"
                name="csrf"
                value="{{ csrf_token }}"
            >

            <label>

                Current HOD password

                <input
                    type="password"
                    name="current_password"
                    required
                    autocomplete="current-password"
                >

            </label>


            <label>

                New password

                <input
                    type="password"
                    name="new_password"
                    required
                    minlength="8"
                    autocomplete="new-password"
                >

            </label>


            <label>

                Confirm new password

                <input
                    type="password"
                    name="confirm_password"
                    required
                    minlength="8"
                    autocomplete="new-password"
                >

            </label>


            <button
                class="button"
                type="submit"
            >
                Change HOD password
                <span>→</span>
            </button>

        </form>

    </section>

</div>

{% endblock %}
