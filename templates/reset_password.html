{% extends "base.html" %}
{% block title %}Set a new password{% endblock %}
{% block content %}
<div class="auth-shell"><a href="/" class="brand auth-brand"><span class="brand-mark">⌁</span><span>Lab<span>Vault</span></span><small>AI</small></a><div class="auth-card"><div class="auth-icon">⌁</div><div class="eyebrow">ACCOUNT RECOVERY</div><h1>Set a new password</h1><p>Choose a new password for your account.</p><form method="post" class="form-stack"><input type="hidden" name="csrf" value="{{ csrf_token }}"><label>New password<div class="password-field"><input required minlength="8" type="password" name="password" placeholder="At least 8 characters" autocomplete="new-password"><button type="button" data-password-toggle>Show</button></div></label><label>Confirm new password<div class="password-field"><input required minlength="8" type="password" name="confirm" placeholder="Re-enter password" autocomplete="new-password"><button type="button" data-password-toggle>Show</button></div></label><button class="button full" type="submit">Update password <span>→</span></button></form></div><p class="auth-foot">Protected workspace · LabVault {{ now.year }}</p></div>
{% endblock %}
