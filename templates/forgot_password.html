{% extends "base.html" %}
{% block title %}Forgot password{% endblock %}
{% block content %}
<div class="auth-shell"><a href="/" class="brand auth-brand"><span class="brand-mark">⌁</span><span>Lab<span>Vault</span></span><small>AI</small></a><div class="auth-card"><div class="auth-icon">⌁</div><div class="eyebrow">ACCOUNT RECOVERY</div><h1>Reset your password</h1><p>Enter the email you registered with and we'll send a secure reset link.</p><form method="post" class="form-stack"><input type="hidden" name="csrf" value="{{ csrf_token }}"><label>Registered email<input required type="email" name="email" placeholder="you@college.edu" autocomplete="email"></label><button class="button full" type="submit">Send reset link <span>→</span></button></form><div class="auth-switch"><a href="{{ url_for('login', role='student') }}">← Back to sign in</a></div></div><p class="auth-foot">Protected workspace · LabVault {{ now.year }}</p></div>
{% endblock %}
